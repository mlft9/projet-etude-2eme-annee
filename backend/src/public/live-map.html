<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parcell-IA - Carte temps réel</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"
    />
    <style>
      :root {
        --bg: #f2efe6;
        --panel: #ffffff;
        --ink: #1f2d22;
        --accent: #205840;
        --warn: #cf7b20;
        --danger: #a13228;
        --muted: #647768;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top right, #f8f5ee 0%, var(--bg) 60%);
        color: var(--ink);
      }

      .layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        min-height: 100vh;
      }

      .sidebar {
        background: var(--panel);
        border-right: 1px solid #dde3d9;
        padding: 18px;
      }

      .title {
        margin: 0 0 8px;
        font-size: 24px;
        letter-spacing: 0.2px;
      }

      .status {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 14px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 8px 0;
        font-size: 14px;
      }

      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
      }

      #map {
        width: 100%;
        height: 100vh;
      }

      .metrics {
        margin-top: 18px;
        padding-top: 12px;
        border-top: 1px dashed #d8dfd6;
      }

      .metrics p {
        margin: 8px 0;
        font-size: 14px;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }

        .sidebar {
          border-right: none;
          border-bottom: 1px solid #dde3d9;
        }

        #map {
          height: 72vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h1 class="title">Zones agricoles live</h1>
        <p id="streamState" class="status">Connexion au flux temps réel...</p>

        <div>
          <strong>Niveau de risque</strong>
          <div class="legend-item"><span class="dot" style="background:#256d4f"></span> Aucun / Faible</div>
          <div class="legend-item"><span class="dot" style="background:#cf7b20"></span> Modéré</div>
          <div class="legend-item"><span class="dot" style="background:#a13228"></span> Élevé</div>
        </div>

        <div class="metrics">
          <p><strong>Astuce :</strong> utilise l’outil de dessin (en haut à gauche de la carte) pour ajouter une nouvelle zone.</p>
          <p>Les zones dessinées sont aussi injectées dans le flux live.</p>
        </div>
      </aside>

      <main>
        <div id="map"></div>
      </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

    <script>
      const map = L.map('map').setView([48.8566, 2.3522], 11);
      const streamState = document.getElementById('streamState');

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors',
      }).addTo(map);

      const zonesLayer = L.geoJSON([], {
        style(feature) {
          const risk = feature.properties.niveau_risque;
          let fillColor = '#256d4f';

          if (risk === 'Modéré') fillColor = '#cf7b20';
          if (risk === 'Élevé') fillColor = '#a13228';

          return {
            color: fillColor,
            fillColor,
            weight: 2,
            fillOpacity: 0.28,
          };
        },
        onEachFeature(feature, layer) {
          const p = feature.properties;
          layer.bindPopup(`
            <strong>${p.name}</strong><br/>
            Culture: ${p.culture || 'N/A'}<br/>
            Risque: ${p.niveau_risque}<br/>
            Maladie: ${p.maladie_detectee || 'N/A'}<br/>
            Température: ${p.temperature} °C<br/>
            Humidité: ${p.humidite} %<br/>
            Pluviométrie: ${p.pluviometrie} mm<br/>
            Source capteur: ${p.source_capteur}<br/>
            MAJ: ${new Date(p.updated_at).toLocaleTimeString('fr-FR')}
          `);
        },
      }).addTo(map);

      const drawnItems = new L.FeatureGroup();
      map.addLayer(drawnItems);

      const drawControl = new L.Control.Draw({
        position: 'topleft',
        draw: {
          polyline: false,
          circle: false,
          marker: false,
          circlemarker: false,
          rectangle: true,
          polygon: true,
        },
        edit: {
          featureGroup: drawnItems,
          remove: false,
        },
      });

      map.addControl(drawControl);

      map.on(L.Draw.Event.CREATED, async (event) => {
        const layer = event.layer;
        const geojson = layer.toGeoJSON();
        const zoneName = window.prompt('Nom de la zone', `Zone ${Date.now()}`) || `Zone ${Date.now()}`;

        try {
          const response = await fetch('/zones/drawings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              geometry: geojson.geometry,
              properties: {
                id: Date.now(),
                name: zoneName,
                niveau_risque: 'Faible',
              },
            }),
          });

          if (!response.ok) {
            throw new Error('Echec enregistrement zone');
          }

          drawnItems.addLayer(layer);
        } catch (error) {
          alert(error.message);
        }
      });

      function renderFeatureCollection(payload) {
        zonesLayer.clearLayers();
        drawnItems.clearLayers();

        zonesLayer.addData(payload);

        payload.features
          .filter((feature) => feature.properties && feature.properties.is_drawn)
          .forEach((feature) => {
            drawnItems.addLayer(L.geoJSON(feature));
          });
      }

      async function initialLoad() {
        const response = await fetch('/zones');
        const payload = await response.json();
        renderFeatureCollection(payload);
      }

      function connectStream() {
        const events = new EventSource('/zones/stream');

        events.onopen = () => {
          streamState.textContent = 'Flux connecté. Mise à jour toutes les 3s.';
        };

        events.onmessage = (event) => {
          const payload = JSON.parse(event.data);
          if (payload.features) {
            renderFeatureCollection(payload);
          }
        };

        events.onerror = () => {
          streamState.textContent = 'Flux interrompu, tentative de reconnexion...';
        };
      }

      initialLoad().then(connectStream).catch(() => {
        streamState.textContent = 'Impossible de charger les zones.';
      });
    </script>
  </body>
</html>
