version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: parcell-ia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parcell_ia}
      POSTGRES_USER: ${POSTGRES_USER:-parcell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parcell_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: parcell-ia-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-parcell}:${POSTGRES_PASSWORD:-parcell_secret}@db:5432/${POSTGRES_DB:-parcell_ia}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_prod}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  mobile:
    build: ./mobile
    container_name: parcell-ia-mobile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      EXPO_PUBLIC_API_URL: http://backend:3000
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
    volumes:
      - ./mobile:/app
      - /app/node_modules

volumes:
  postgres_data:
